<!DOCTYPE html>
<!--
  LifeStreamer remote control.

  One self-contained file: no CDN, no web fonts, no external anything. The Wi-Fi carrying this
  may have no internet at all — a phone hotspot, a venue LAN — and a page that waits on a font
  is a page that never loads when it matters.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LifeStreamer remote</title>
<style>
  :root {
    --bg: #121212; --panel: #1e1e1e; --line: #333;
    --text: #eee; --dim: #999; --accent: #4caf50; --warn: #ffb300; --bad: #e53935;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, Roboto, sans-serif;
    user-select: none; padding: 8px; padding-bottom: 24px;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 14px 0 6px; }
  button {
    background: #2a2a2a; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; font-size: 13px; min-height: 44px; cursor: pointer;
  }
  button.on { background: var(--accent); border-color: var(--accent); color: #062; font-weight: 600; }
  button:disabled { opacity: .4; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

  /* The schematic, with an optional picture of what goes out behind it (a few frames a second,
     only while asked for: see loadPicture). */
  #stage { position: relative; width: 100%; background: #000; border: 1px solid var(--line);
           border-radius: 8px; overflow: hidden; touch-action: none; aspect-ratio: 16/9; }
  #stageImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill;
              pointer-events: none; }
  #picRow { align-items: center; margin-bottom: 6px; }
  #picRow .muted { margin-right: 4px; }
  #stage .grid { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, #ffffff14 1px, transparent 1px),
                      linear-gradient(to bottom, #ffffff14 1px, transparent 1px);
    background-size: 33.33% 33.33%; }
  .layer { position: absolute; border: 2px solid #fff; border-radius: 4px;
           display: flex; align-items: flex-start; justify-content: flex-start;
           font-size: 11px; overflow: hidden; }
  .layer .tag { background: #000a; padding: 2px 5px; border-radius: 0 0 4px 0; white-space: nowrap; }
  .layer.sel { border-color: var(--accent); border-width: 3px; }
  .layer.hidden { opacity: .35; border-style: dashed; }
  .handle { position: absolute; right: 0; bottom: 0; width: 28px; height: 28px;
            background: var(--accent); border-radius: 4px 0 0 0; }

  /* The `hidden` attribute hides through the browser's own [hidden]{display:none}, which loses
     to any author rule that sets display -- and both #gate and #main set one. Without this the
     gate stays on screen after a correct PIN (it is fixed, inset 0, z-index 10, so it covers
     everything) and the page looks like the button did nothing. */
  [hidden] { display: none !important; }

  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; z-index: 10;
          flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  #pin { font-size: 28px; letter-spacing: .4em; text-align: center; width: 200px; padding: 10px;
         background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
  #status { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; font-size: 13px;
            text-align: center; z-index: 9; display: none; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #thermal { margin-bottom: 8px; }
  .muted { color: var(--dim); font-size: 12px; }
  /* The live bar is the most important control on the page, so it sits on top and reads at a
     glance: what state the stream is in, and the one button that changes it. */
  #live { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #live .info { flex: 1; min-width: 0; }
  #liveStatus { font-weight: 700; font-size: 16px; display: flex; align-items: center; }
  #liveMeta { font-variant-numeric: tabular-nums; }
  #liveReason { color: var(--warn); font-size: 12px; }
  #liveBtn { min-width: 116px; font-weight: 700; font-size: 15px; }
  #liveBtn.start { background: var(--accent); border-color: var(--accent); color: #062; }
  #liveBtn.stop { background: var(--bad); border-color: var(--bad); color: #fff; }
  .st-live { background: var(--bad); }
  .st-busy { background: var(--warn); }
  .st-idle { background: #666; }
  /* Recording sits right under the live bar: the other thing that must not stop unnoticed. */
  #rec { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #rec .info { flex: 1; min-width: 0; }
  #recStatus { font-weight: 700; display: flex; align-items: center; }
  #recMeta { font-variant-numeric: tabular-nums; }
  #recReason { color: var(--warn); font-size: 12px; }
  #recBtn { min-width: 116px; }
  .st-rec { background: #e33; animation: recblink 1.2s steps(2, start) infinite; }
  @keyframes recblink { to { visibility: hidden; } }

  /* An in-page dialog rather than window.confirm, which mobile browsers may suppress. */
  #confirm { position: fixed; inset: 0; background: #000b; z-index: 20; display: flex;
             align-items: center; justify-content: center; padding: 20px; }
  #confirm .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                  padding: 16px; max-width: 360px; width: 100%; }
  #confirm .title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  #confirm .row { justify-content: flex-end; margin-top: 14px; }
  #confirmOk.danger { background: var(--bad); border-color: var(--bad); color: #fff; }

  .seg button { min-height: 36px; padding: 6px 10px; }
  .cam-group { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase;
               letter-spacing: .06em; margin: 12px 0 2px; }
  .cam-field .ctl input[type=range] { flex: 1; min-width: 0; }
  .cam-field.wide { grid-template-columns: 1fr; }
  .cam-field .cam-value { min-width: 56px; text-align: right; }
  .swatch { width: 36px; min-height: 36px; padding: 0; border: 2px solid var(--line); }
  .swatch.on { border-color: var(--accent); }
  input[type=color] { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 6px;
                      background: #2a2a2a; padding: 2px; }
  input[type=range] { accent-color: var(--accent); }

  /* The live and recording bars and the tabs stay on top while a tab scrolls under them. */
  #top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 2px; }
  #top .panel { padding: 8px 10px; }
  .tabs { display: flex; gap: 4px; margin: 0 0 8px; }
  .tabs button { flex: 1; min-height: 40px; padding: 6px 4px; }
  .tab[hidden] { display: none; }
  .cols { display: block; }
  @media (min-width: 900px) {
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
    #main { max-width: 1200px; margin: 0 auto; }
  }

  /* Settings forms */
  input, select, textarea { user-select: text; -webkit-user-select: text; }
  .set-groups { margin-bottom: 8px; }
  .field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 52%); gap: 4px 10px;
           align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field > label { font-size: 13px; }
  .field .sub { grid-column: 1 / -1; font-size: 11px; color: var(--dim); }
  .field .err { grid-column: 1 / -1; font-size: 12px; color: var(--bad); }
  .field.dirty > label::after { content: " \2022"; color: var(--warn); }
  .field input[type=text], .field input[type=number], .field input[type=password], .field select {
    width: 100%; min-height: 40px; padding: 8px; font-size: 14px; color: var(--text);
    background: #2a2a2a; border: 1px solid var(--line); border-radius: 6px; }
  .field input:disabled, .field select:disabled { opacity: .45; }
  .field .ctl { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .field .ctl > input, .field .ctl > select { flex: 1; min-width: 0; }
  .field .unit { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .field button.toggle { min-height: 36px; width: 100%; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px;
           background: #333; color: var(--dim); margin-left: 6px; vertical-align: 1px; }
  .badge.wait { background: #4a3a00; color: var(--warn); }
  .set-actions { justify-content: flex-end; margin-top: 8px; }
  #setWarnings { color: var(--warn); font-size: 12px; margin-top: 6px; }
  @media (min-width: 900px) {
    /* Two columns of fields: a control a whole screen wide is hard to read */
    #setForm, #powerForm { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
    #setForm .field:nth-last-child(2):nth-child(odd), #powerForm .field:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
  }
</style>
</head>
<body>

<div id="status"></div>

<div id="gate">
  <div style="font-size:18px">LifeStreamer remote</div>
  <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="------" autofocus>
  <button id="gateGo">Connect</button>
  <div id="gateError" style="color:var(--bad);min-height:18px"></div>
</div>

<div id="confirm" hidden>
  <div class="box">
    <div class="title" id="confirmTitle"></div>
    <div class="muted" id="confirmText"></div>
    <div class="row">
      <button id="confirmCancel">Cancel</button>
      <button id="confirmOk"></button>
    </div>
  </div>
</div>

<div id="main" hidden>
  <div id="top">
    <div id="live" class="panel">
      <div class="info">
        <div id="liveStatus"><span class="dot st-idle"></span><span>Not streaming</span></div>
        <div id="liveMeta" class="muted"></div>
        <div id="liveReason"></div>
      </div>
      <button id="liveBtn" class="start">Start live</button>
    </div>
    <div id="rec" class="panel">
      <div class="info">
        <div id="recStatus"><span class="dot st-idle"></span><span>Recording off</span></div>
        <div id="recMeta" class="muted"></div>
        <div id="recReason"></div>
      </div>
      <button id="recBtn">Turn on</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="live">Live</button>
      <button data-tab="cameras">Cameras</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="power">Power</button>
    </nav>
  </div>

  <section class="tab" id="tab-live">
    <div class="cols">
      <div>
        <div id="thermal" class="panel" hidden></div>
        <div class="row seg" id="picRow">
          <span class="muted">Picture</span>
          <button data-pic="0">Off</button>
          <button data-pic="0.5">0.5 fps</button>
          <button data-pic="1">1 fps</button>
          <button data-pic="2">2 fps</button>
        </div>
        <div id="stage"><img id="stageImg" alt="" hidden><div class="grid"></div></div>
        <div class="muted" id="picNote" style="margin-top:4px"></div>
        <h2>Layout</h2>
        <div class="row" id="presets"></div>
        <div class="row" style="margin-top:6px">
          <button id="swap">⇄ Swap</button>
          <button id="mute">Mute</button>
        </div>
      </div>
      <div>
        <h2>Camera</h2>
        <div class="panel" id="camBox"><div class="muted">No camera in use</div></div>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-cameras" hidden>
    <div class="cols">
      <div>
        <h2>Composition</h2>
        <div class="panel" id="compBox">
          <div class="row" style="align-items:center;justify-content:space-between">
            <div id="compLabel" class="muted"></div>
            <button id="compToggle">Turn on</button>
          </div>
          <div id="compDetails">
            <div class="muted" style="margin-top:8px">Second layer</div>
            <div class="row seg" id="pipSources" style="margin-top:4px"></div>
            <div class="muted" id="pipReason" style="margin-top:4px"></div>
            <div class="muted" style="margin-top:8px">Background</div>
            <div class="row" id="bgRow" style="margin-top:4px;align-items:center"></div>
          </div>
        </div>
      </div>
      <div>
        <h2>Layers</h2>
        <div id="layers"></div>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-settings" hidden>
    <div class="row seg set-groups" id="setGroups"></div>
    <div class="muted" id="setNote" style="margin-bottom:6px"></div>
    <div class="panel" id="setForm"><div class="muted">Loading…</div></div>
    <div id="setWarnings"></div>
    <div class="row set-actions">
      <button id="setDiscard">Discard changes</button>
      <button id="setSave" class="on">Save</button>
    </div>
  </section>

  <section class="tab" id="tab-power" hidden>
    <h2>Preview right now</h2>
    <div class="row">
      <button data-preview="off">Preview off</button>
      <button data-preview="on">Preview on</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button data-res="0">Full size</button>
      <button data-res="540">540p</button>
      <button data-res="360">360p</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button data-fps="0">Full rate</button>
      <button data-fps="15">15 fps</button>
      <button data-fps="10">10 fps</button>
    </div>
    <div class="muted" style="margin-top:6px" id="powerNote">
      None of these change what you stream.
    </div>
    <h2>Power and screen settings</h2>
    <div class="panel" id="powerForm"><div class="muted">Loading…</div></div>
    <div class="row set-actions">
      <button id="powerSave" class="on">Save</button>
    </div>
  </section>
</div>

<script>
"use strict";

var token = sessionStorage.getItem("lsToken") || "";
var state = null;
var selected = null;
var events = null;

// While dragging we ignore inbound rects for that layer, otherwise the box fights the finger:
// the server keeps pushing the pre-drag position until our update lands.
var dragging = null;
var pendingRect = null;
var rectInFlight = false;

// Live stats arrive on their own event every two seconds; the uptime is interpolated in between
// from the phone's own count, so a clock difference between phone and browser cannot skew it.
var liveStats = null;
var liveStatsAt = 0;

// While a finger is on an opacity slider the layers panel must not be rebuilt under it.
var styleHeld = false;
var pendingStyle = null;
var styleInFlight = false;
// The camera panel: which camera it shows, what is under a finger, and one request in flight per
// control with the newest value waiting (like the zoom used to be).
var camTarget = null;
var camHeld = {};
var camPending = {};
var camInFlight = {};

function api(path, body, method) {
  var verb = method || "POST";
  var init = {
    method: verb,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
  };
  // A GET or HEAD with a body is rejected outright by the browser ("Request cannot have a
  // body"), so the request never leaves and the page looks dead right after the PIN.
  if (verb !== "GET" && verb !== "HEAD") {
    init.body = body === undefined ? "{}" : JSON.stringify(body);
  }
  return fetch(path, init).then(function (r) {
    if (r.status === 401) { signOut(); throw new Error("unauthorized"); }
    return r.status === 204 ? null : r.json().catch(function () { return null; });
  }).then(function (body) {
    // The server used to answer ok to everything, so a refused or misunderstood command was
    // indistinguishable from a working one. Now a refusal says so.
    if (body && body.ok === false && body.error) showStatus(body.error, "#7a3a3a");
    return body;
  }).catch(function (e) {
    if (e && e.message !== "unauthorized") showStatus("Phone did not answer", "#7a3a3a");
    throw e;
  });
}

function signOut() {
  token = "";
  clearPicture();
  settings = null;
  dirty = {};
  sessionStorage.removeItem("lsToken");
  if (events) { events.close(); events = null; }
  document.getElementById("gate").hidden = false;
  document.getElementById("main").hidden = true;
}

function showStatus(text, color) {
  var el = document.getElementById("status");
  el.textContent = text;
  el.style.background = color || "#333";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.style.display = "none"; }, 4000);
}

function connect() {
  if (events) events.close();
  events = new EventSource("/api/events?token=" + encodeURIComponent(token));
  events.addEventListener("state", function (e) { render(JSON.parse(e.data)); });
  events.addEventListener("stats", function (e) {
    liveStats = JSON.parse(e.data);
    liveStatsAt = Date.now();
    recStats = liveStats.recordingBytes !== null && liveStats.recordingBytes !== undefined
      ? liveStats : null;
    renderLiveMeta();
    renderRecMeta();
  });
  events.addEventListener("message", function (e) {
    showStatus(JSON.parse(e.data).text, "#444");
  });
  events.addEventListener("settings", function () { settingsChanged(); });
  events.onerror = function () { showStatus("Reconnecting…", "#7a5"); };
}

function authenticate(pin) {
  return fetch("/api/auth", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin: pin })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); });
}

function enter(pin) {
  var err = document.getElementById("gateError");
  err.textContent = "";
  authenticate(pin).then(function (res) {
    if (!res.ok) {
      err.textContent = res.body && res.body.error === "locked"
        ? "Too many attempts. Wait a moment."
        : "Wrong PIN";
      return;
    }
    token = res.body.token;
    sessionStorage.setItem("lsToken", token);
    document.getElementById("gate").hidden = true;
    document.getElementById("main").hidden = false;
    connect();
    api("/api/state", undefined, "GET").then(render);
    showTab(currentTab());
  }).catch(function () { err.textContent = "Could not reach the phone"; });
}

document.getElementById("gateGo").onclick = function () {
  enter(document.getElementById("pin").value.trim());
};
document.getElementById("pin").addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.getElementById("gateGo").click();
});

// ---- rendering ----

function render(s) {
  if (!s) return;
  state = s;

  var stage = document.getElementById("stage");
  if (s.canvasWidth > 0 && s.canvasHeight > 0) {
    setStageAspect(s.canvasWidth, s.canvasHeight);
  }

  var wasLive = lastLiveKey;
  lastLiveKey = s.stream ? s.stream.status + "/" + (s.recording && s.recording.state) : "";
  renderLive(s.stream);
  renderRecording(s.recording);
  // Starting or stopping changes what can be edited and what waits: fetch them again
  if (wasLive !== null && wasLive !== lastLiveKey) settingsChanged();
  renderComposition(s);
  renderThermal(s.thermal);
  renderPresets(s.presets, s.activePresetId);
  renderStage(s.layers);
  renderLayers(s.layers, s.cameras);
  renderCamera(s.cameraTargets);
  renderPower(s.power);

  var mute = document.getElementById("mute");
  mute.textContent = s.muted ? "Unmute" : "Mute";
  mute.className = s.muted ? "on" : "";
}

// ---- live bar ----

var LIVE_STATES = {
  NOT_STREAMING: { text: "Not streaming", dot: "st-idle" },
  STARTING: { text: "Starting…", dot: "st-busy" },
  CONNECTING: { text: "Connecting…", dot: "st-busy" },
  STREAMING: { text: "Live", dot: "st-live" },
  ERROR: { text: "Error", dot: "st-idle" }
};

function isLiveOrGoing(st) {
  return st && (st.status === "STREAMING" || st.status === "STARTING" ||
                st.status === "CONNECTING" || st.reconnecting);
}

function renderLive(st) {
  if (!st) return;
  var info = LIVE_STATES[st.status] || LIVE_STATES.NOT_STREAMING;
  var text = st.reconnecting ? (st.reconnectionMessage || "Reconnecting…") : info.text;
  var status = document.getElementById("liveStatus");
  status.innerHTML = "";
  var dot = document.createElement("span");
  dot.className = "dot " + (st.reconnecting ? "st-busy" : info.dot);
  var label = document.createElement("span");
  label.textContent = text;
  status.appendChild(dot);
  status.appendChild(label);

  // Why it stopped, or why it cannot start: the operator is not next to the phone to find out.
  var reason = "";
  if (st.status === "ERROR" && st.lastError) reason = st.lastError;
  else if (!isLiveOrGoing(st) && !st.canStart && st.startBlockedReason) reason = st.startBlockedReason;
  else if (!isLiveOrGoing(st) && st.lastError) reason = "Last error: " + st.lastError;
  document.getElementById("liveReason").textContent = reason;

  var btn = document.getElementById("liveBtn");
  if (isLiveOrGoing(st)) {
    btn.textContent = "Stop";
    btn.className = "stop";
    btn.disabled = false;
  } else {
    btn.textContent = "Start live";
    btn.className = "start";
    btn.disabled = !st.canStart;
  }
  if (st.status !== "STREAMING") liveStats = null;
  renderLiveMeta();
}

function formatUptime(sec) {
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
  return h > 0 ? h + ":" + mm + ":" + ss : m + ":" + ss;
}

function renderLiveMeta() {
  var el = document.getElementById("liveMeta");
  var st = state && state.stream;
  if (!st || st.status !== "STREAMING" || !liveStats) { el.textContent = ""; return; }
  var parts = [];
  if (liveStats.uptimeSec !== null && liveStats.uptimeSec !== undefined) {
    parts.push(formatUptime(liveStats.uptimeSec + Math.floor((Date.now() - liveStatsAt) / 1000)));
  }
  if (liveStats.bitrateKbps) {
    parts.push(liveStats.bitrateKbps >= 1000
      ? (liveStats.bitrateKbps / 1000).toFixed(2) + " Mbps"
      : liveStats.bitrateKbps + " kb/s");
  }
  if (liveStats.fps) parts.push(liveStats.fps.toFixed(1) + " fps");
  el.textContent = parts.join(" · ");
}
setInterval(renderLiveMeta, 1000);

document.getElementById("liveBtn").onclick = function () {
  var st = state && state.stream;
  if (!st) return;
  if (isLiveOrGoing(st)) {
    // Ending the stream cannot be undone, and on a phone a stray tap is easy.
    confirmDialog("End the stream?", "The live stream stops for everyone watching.", "Stop", true)
      .then(function (yes) { if (yes) api("/api/stream/stop"); });
  } else {
    api("/api/stream/start").catch(function () {});
  }
};

// ---- recording ----

var recStats = null;

var REC_STATES = {
  OFF: { text: "Recording off", dot: "st-idle" },
  ARMED: { text: "Recording on: starts with the live", dot: "st-idle" },
  RECORDING: { text: "REC", dot: "st-rec" },
  ERROR: { text: "Recording stopped", dot: "st-busy" }
};

function formatBytes(b) {
  return b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : Math.round(b / 1e6) + " MB";
}

function renderRecording(rec) {
  if (!rec) return;
  var info = REC_STATES[rec.state] || REC_STATES.OFF;
  var status = document.getElementById("recStatus");
  status.innerHTML = "";
  var dot = document.createElement("span");
  dot.className = "dot " + info.dot;
  var label = document.createElement("span");
  var text = info.text;
  if (rec.state === "RECORDING") {
    text += " · " + (rec.resolution || "") + " · segment " + rec.segmentIndex;
  }
  label.textContent = text;
  status.appendChild(dot);
  status.appendChild(label);

  document.getElementById("recReason").textContent = rec.error || rec.warning || "";

  var btn = document.getElementById("recBtn");
  btn.textContent = rec.enabled ? "Turn off" : "Turn on";
  btn.className = rec.enabled ? "" : "on";
  if (rec.state !== "RECORDING") recStats = null;
  renderRecMeta();
}

function renderRecMeta() {
  var el = document.getElementById("recMeta");
  var rec = state && state.recording;
  if (!rec || rec.state !== "RECORDING" || !recStats) { el.textContent = ""; return; }
  var parts = [formatBytes(recStats.recordingBytes)];
  if (recStats.recordingFreeMb !== null && recStats.recordingFreeMb !== undefined) {
    parts.push((recStats.recordingFreeMb / 1000).toFixed(1) + " GB free");
  }
  if (recStats.recordingMinutesLeft !== null && recStats.recordingMinutesLeft !== undefined) {
    var m = recStats.recordingMinutesLeft;
    parts.push("~" + (m >= 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : m + " min") + " left");
  }
  el.textContent = parts.join(" · ");
}

document.getElementById("recBtn").onclick = function () {
  var rec = state && state.recording;
  if (!rec) return;
  if (!rec.enabled) {
    // A refusal (no folder, card full) comes back as a 409 and shows through api()
    api("/api/recording", { enabled: true }).catch(function () {});
  } else if (rec.state === "RECORDING") {
    confirmDialog("Stop recording?", "The live continues; only the recording stops.", "Stop recording", true)
      .then(function (yes) { if (yes) api("/api/recording", { enabled: false }).catch(function () {}); });
  } else {
    api("/api/recording", { enabled: false }).catch(function () {});
  }
};

// ---- confirmation dialog ----

var confirmResolve = null;

function confirmDialog(title, text, okLabel, danger) {
  document.getElementById("confirmTitle").textContent = title;
  document.getElementById("confirmText").textContent = text;
  var ok = document.getElementById("confirmOk");
  ok.textContent = okLabel;
  ok.className = danger ? "danger" : "on";
  document.getElementById("confirm").hidden = false;
  return new Promise(function (resolve) { confirmResolve = resolve; });
}

function closeConfirm(answer) {
  document.getElementById("confirm").hidden = true;
  if (confirmResolve) { var r = confirmResolve; confirmResolve = null; r(answer); }
}
document.getElementById("confirmOk").onclick = function () { closeConfirm(true); };
document.getElementById("confirmCancel").onclick = function () { closeConfirm(false); };
document.getElementById("confirm").addEventListener("click", function (e) {
  if (e.target.id === "confirm") closeConfirm(false);
});

// ---- composition ----

var BG_SWATCHES = ["#000000", "#FFFFFF", "#404040", "#00B140", "#0047BB"];

function renderComposition(s) {
  var on = !!s.composition;
  document.getElementById("compLabel").textContent = on ? "On" : "Off — only the main camera";
  var toggle = document.getElementById("compToggle");
  toggle.textContent = on ? "Turn off" : "Turn on";
  toggle.className = on ? "" : "on";

  var box = document.getElementById("pipSources");
  box.innerHTML = "";
  var reasonEl = document.getElementById("pipReason");
  reasonEl.textContent = "";
  (s.pipSources || []).forEach(function (p) {
    var b = document.createElement("button");
    b.textContent = p.label;
    if (p.active) b.className = "on";
    if (!p.available) {
      b.disabled = true;
      b.title = p.reason || "";
    }
    b.onclick = function () { api("/api/layer/source", { kind: p.kind }); };
    box.appendChild(b);
  });
  // The reasons of the unavailable ones, so a disabled button is never a mystery.
  var why = (s.pipSources || []).filter(function (p) { return !p.available && p.reason; })
    .map(function (p) { return p.label + ": " + p.reason; });
  reasonEl.textContent = why.join(" · ");

  var pip = (s.layers || []).filter(function (l) { return l.id === "pip"; })[0];
  if (pip && pip.onPlaceholder && pip.sourceKind && pip.sourceKind !== "TEST_IMAGE") {
    reasonEl.textContent = "Showing the test image: the chosen source is not available. " + reasonEl.textContent;
  }

  var bg = document.getElementById("bgRow");
  if (!bg.querySelector("input")) {
    BG_SWATCHES.forEach(function (c) {
      var sw = document.createElement("button");
      sw.className = "swatch";
      sw.dataset.color = c;
      sw.style.background = c;
      sw.title = c;
      sw.onclick = function () { api("/api/background", { color: c }); };
      bg.appendChild(sw);
    });
    var picker = document.createElement("input");
    picker.type = "color";
    picker.onchange = function () { api("/api/background", { color: picker.value.toUpperCase() }); };
    bg.appendChild(picker);
  }
  var current = (s.backgroundColor || "").toUpperCase();
  bg.querySelectorAll(".swatch").forEach(function (sw) {
    sw.className = "swatch" + (sw.dataset.color === current ? " on" : "");
  });
  if (current) bg.querySelector("input").value = current.toLowerCase();

  document.getElementById("compDetails").style.opacity = on ? "1" : ".6";
}

document.getElementById("compToggle").onclick = function () {
  var on = !!(state && state.composition);
  var go = function () { api("/api/composition", { enabled: !on }); };
  if (state && isLiveOrGoing(state.stream)) {
    confirmDialog(on ? "Turn the composition off?" : "Turn the composition on?",
      "The stream stays on air, but the picture freezes for about a second while the cameras switch.",
      on ? "Turn off" : "Turn on", false).then(function (yes) { if (yes) go(); });
  } else {
    go();
  }
};

/**
 * Coalesced like zoom and the drag rectangles: one request in flight, the newest wins.
 */
function sendStyle(layerId, patch) {
  pendingStyle = Object.assign({ layerId: layerId }, patch);
  if (styleInFlight) return;
  styleInFlight = true;
  var payload = pendingStyle;
  pendingStyle = null;
  api("/api/layer/style", payload).catch(function () {}).then(function () {
    styleInFlight = false;
    if (pendingStyle) sendStyle(pendingStyle.layerId, pendingStyle);
  });
}

function buildStyleRow(l) {
  var wrap = document.createElement("div");
  wrap.style.marginTop = "6px";

  var seg = document.createElement("div");
  seg.className = "row seg";
  [["FILL", "Fill"], ["FIT", "Fit"], ["STRETCH", "Stretch"]].forEach(function (m) {
    var b = document.createElement("button");
    b.textContent = m[1];
    if (l.scaleMode === m[0]) b.className = "on";
    b.onclick = function () { api("/api/layer/style", { layerId: l.id, scaleMode: m[0] }); };
    seg.appendChild(b);
  });
  var mirror = document.createElement("button");
  mirror.textContent = "Mirror";
  if (l.mirror) mirror.className = "on";
  mirror.onclick = function () { api("/api/layer/style", { layerId: l.id, mirror: !l.mirror }); };
  seg.appendChild(mirror);
  var rot = document.createElement("button");
  rot.textContent = "↻ " + (l.rotation || 0) + "°";
  rot.onclick = function () { api("/api/layer/style", { layerId: l.id, rotation: (l.rotation || 0) + 90 }); };
  seg.appendChild(rot);
  wrap.appendChild(seg);

  var opRow = document.createElement("div");
  opRow.className = "row";
  opRow.style.alignItems = "center";
  opRow.style.marginTop = "4px";
  var opLabel = document.createElement("div");
  opLabel.className = "muted";
  opLabel.style.minWidth = "84px";
  opLabel.textContent = "Opacity " + Math.round((l.alpha || 1) * 100) + "%";
  var slider = document.createElement("input");
  slider.type = "range";
  slider.min = 0.1; slider.max = 1; slider.step = 0.05;
  slider.value = l.alpha || 1;
  slider.style.flex = "1";
  slider.addEventListener("pointerdown", function () { styleHeld = true; });
  var release = function () { styleHeld = false; };
  slider.addEventListener("pointerup", release);
  slider.addEventListener("pointercancel", release);
  slider.oninput = function () {
    opLabel.textContent = "Opacity " + Math.round(slider.value * 100) + "%";
    sendStyle(l.id, { alpha: parseFloat(slider.value) });
  };
  opRow.appendChild(opLabel);
  opRow.appendChild(slider);
  wrap.appendChild(opRow);
  return wrap;
}

function renderThermal(t) {
  var box = document.getElementById("thermal");
  if (!t) { box.hidden = true; return; }
  box.hidden = false;

  var colors = { NONE: "#2a2a2a", LIGHT: "#2a2a2a", MODERATE: "#4a3a10", SEVERE: "#5a2410", CRITICAL: "#5a1010" };
  box.style.background = colors[t.level] || "#2a2a2a";

  var parts = [];
  parts.push(t.supported ? "Temperature: " + t.level : "Temperature unknown on this phone");
  // Headroom is the predictive number: it reaches 100% before throttling begins, which is what
  // gives time to react.
  if (t.headroom !== null && t.headroom !== undefined) {
    parts.push("headroom " + Math.round(t.headroom * 100) + "%");
  }
  if (t.powerSaveMode) parts.push("battery saver ON");
  var html = parts.join(" · ");
  if (t.appliedActions && t.appliedActions.length) {
    html += '<div class="muted">' + t.appliedActions.join(" · ") + "</div>";
  }
  box.innerHTML = html;
}

function renderPresets(presets, activeId) {
  var box = document.getElementById("presets");
  box.innerHTML = "";
  (presets || []).forEach(function (p) {
    var b = document.createElement("button");
    b.textContent = p.name;
    // The phone reports which arrangement the layout currently matches, so the operator can see
    // where they are instead of guessing from seven identical buttons.
    if (p.id === activeId) b.className = "on";
    b.onclick = function () { api("/api/layout/preset", { presetId: p.id }); };
    box.appendChild(b);
  });
}

function renderPower(power) {
  if (!power) return;
  document.querySelectorAll("[data-preview]").forEach(function (b) {
    var on = (b.dataset.preview === "on") === (power.previewEnabled !== false);
    b.className = on ? "on" : "";
  });
  document.querySelectorAll("[data-res]").forEach(function (b) {
    var want = parseInt(b.dataset.res, 10) || null;
    b.className = (power.previewShortEdge || null) === want ? "on" : "";
  });
  document.querySelectorAll("[data-fps]").forEach(function (b) {
    var want = parseInt(b.dataset.fps, 10) || null;
    b.className = (power.previewFpsCap || null) === want ? "on" : "";
  });
  var note = document.getElementById("powerNote");
  if (note) {
    note.textContent = power.appliedBy === "thermal"
      ? "The phone set this because it is hot. Changing it here overrules that for 5 minutes."
      : "None of these change what you stream.";
  }
}

function renderStage(layers) {
  var stage = document.getElementById("stage");
  Array.prototype.slice.call(stage.querySelectorAll(".layer")).forEach(function (n) { n.remove(); });

  (layers || []).forEach(function (l) {
    if (dragging && dragging.id === l.id) return;   // our own drag wins
    stage.appendChild(buildLayerBox(l));
  });

  if (dragging) stage.appendChild(buildLayerBox(dragging.layer));
}

function buildLayerBox(l) {
  var d = document.createElement("div");
  d.className = "layer" + (l.id === selected ? " sel" : "") + (l.visible ? "" : " hidden");
  d.style.left = (l.left * 100) + "%";
  d.style.top = (l.top * 100) + "%";
  d.style.width = ((l.right - l.left) * 100) + "%";
  d.style.height = ((l.bottom - l.top) * 100) + "%";
  d.dataset.id = l.id;

  var tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = (l.primary ? "● " : "") + l.label;
  d.appendChild(tag);

  if (l.id === selected) {
    var h = document.createElement("div");
    h.className = "handle";
    d.appendChild(h);
  }
  return d;
}

function renderLayers(layers, cameras) {
  if (styleHeld) return;   // an opacity slider is being dragged; rebuilding would drop it
  var box = document.getElementById("layers");
  box.innerHTML = "";

  (layers || []).forEach(function (l) {
    var panel = document.createElement("div");
    panel.className = "panel";
    panel.style.marginBottom = "6px";

    var head = document.createElement("div");
    head.className = "row";
    head.style.alignItems = "center";
    head.style.justifyContent = "space-between";

    var name = document.createElement("div");
    name.textContent = l.label;
    name.style.fontWeight = "600";
    name.onclick = function () { selected = l.id; render(state); };
    head.appendChild(name);

    var acts = document.createElement("div");
    acts.className = "row";

    var eye = document.createElement("button");
    eye.textContent = l.visible ? "Hide" : "Show";
    eye.onclick = function () { api("/api/layer/visible", { layerId: l.id, visible: !l.visible }); };
    acts.appendChild(eye);

    var prim = document.createElement("button");
    prim.textContent = "Audio";
    prim.className = l.primary ? "on" : "";
    prim.onclick = function () { api("/api/layer/primary", { layerId: l.id }); };
    acts.appendChild(prim);

    head.appendChild(acts);
    panel.appendChild(head);

    var chips = document.createElement("div");
    chips.className = "row";
    chips.style.marginTop = "6px";
    (cameras || []).forEach(function (c) {
      var b = document.createElement("button");
      b.textContent = c.name;
      if (c.id === l.cameraId) b.className = "on";
      else if (c.usedByLayerId) b.disabled = true;
      b.onclick = function () {
        api("/api/layer/camera", { layerId: l.id, cameraId: c.id }).then(function (r) {
          // A refusal says why — an impossible camera pair, for instance — instead of looking
          // like a tap that did nothing.
          if (r && r.ok === false && r.error) showStatus(r.error, "#722");
        });
      };
      chips.appendChild(b);
    });
    panel.appendChild(chips);
    panel.appendChild(buildStyleRow(l));

    box.appendChild(panel);
  });

  if (!layers || !layers.length) {
    box.innerHTML = '<div class="panel muted">No composition running. Turn it on above.</div>';
  }
}

var CAM_GROUPS = { zoom: "Zoom", exposure: "Exposure", focus: "Focus", wb: "White balance",
                  image: "Image", light: "Light", general: "" };

/** How a value reads; mirrors the phone's ControlText. */
function fmtControl(c, v) {
  if (c.format === "zoom") return v.toFixed(1) + "×";
  if (c.format === "ev") { var ev = v * c.scale; return (ev >= 0 ? "+" : "") + ev.toFixed(1) + " EV"; }
  if (c.format === "distance") return v <= 0.01 ? "∞" : (1 / v).toFixed(2) + " m";
  var n = v * c.scale;
  var text = c.scale === 1 ? String(Math.round(n)) : n.toFixed(1);
  return c.unit ? text + " " + c.unit : text;
}

function optionLabel(c, value) {
  var o = (c.options || []).filter(function (x) { return x.value === value; })[0];
  return o ? o.label : "Auto";
}

/**
 * Every control of one camera, drawn from its description (the phone's panel uses the same).
 * With a composition, one camera per camera layer; without, the one camera.
 */
function renderCamera(targets) {
  var box = document.getElementById("camBox");
  targets = targets || [];
  if (!targets.length) {
    box.innerHTML = '<div class="muted">No camera in use. In a composition, only the layers that show a camera have controls.</div>';
    box.dataset.for = "";
    return;
  }
  // The layer picked on the stage, when it is a camera; else the one picked here; else the first
  var byId = function (id) { return targets.filter(function (t) { return t.id === id; })[0]; };
  var target = byId(selected) || byId(camTarget) || targets[0];
  camTarget = target.id;
  var signature = targets.map(function (t) { return t.id + ":" + t.label; }).join("|") + "@" +
    target.id + "|" + target.cameraKey + "|" + target.active + "|" +
    target.controls.map(function (c) {
      return [c.key, c.type, c.min, c.max, c.options ? c.options.length : 0, c.enabled].join(",");
    }).join(";");
  if (box.dataset.for !== signature) {
    box.dataset.for = signature;
    buildCamera(box, targets, target);
  } else {
    updateCamera(box, target);
  }
}

function buildCamera(box, targets, target) {
  box.innerHTML = "";
  if (targets.length > 1) {
    var picker = document.createElement("div");
    picker.className = "row seg";
    targets.forEach(function (t) {
      var b = document.createElement("button");
      b.textContent = t.label;
      if (t.id === target.id) b.className = "on";
      b.onclick = function () { camTarget = t.id; selected = t.id; render(state); };
      picker.appendChild(b);
    });
    box.appendChild(picker);
  }
  var note = document.createElement("div");
  note.className = "muted";
  note.style.margin = "6px 0 2px";
  note.textContent = target.active
    ? "Remembered for this camera, and applied whenever it turns on."
    : "This camera is off (preview off and not live): changes apply when it turns on.";
  box.appendChild(note);

  var group = null;
  target.controls.forEach(function (c) {
    if (c.group !== group) {
      group = c.group;
      if (CAM_GROUPS[group]) {
        var h = document.createElement("div");
        h.className = "cam-group";
        h.textContent = CAM_GROUPS[group];
        box.appendChild(h);
      }
    }
    box.appendChild(buildCameraControl(target, c));
  });
  updateCamera(box, target);
}

function buildCameraControl(target, c) {
  var row = document.createElement("div");
  row.className = "field cam-field";
  row.dataset.key = c.key;
  var label = document.createElement("label");
  label.textContent = c.label;
  row.appendChild(label);
  var ctl = document.createElement("div");
  ctl.className = "ctl";
  row.appendChild(ctl);

  // Sliders take the whole row, under their label
  if (c.type === "range") row.className += " wide";
  if (c.type === "choice" && (c.options || []).length <= 3) {
    var seg = document.createElement("div");
    seg.className = "row seg";
    (c.options || []).forEach(function (o) {
      var b = document.createElement("button");
      b.textContent = o.label;
      b.dataset.value = o.value;
      b.disabled = !c.enabled;
      b.onclick = function () { sendCamera(target.id, c.key, o.value); };
      seg.appendChild(b);
    });
    ctl.appendChild(seg);
  } else if (c.type === "choice") {
    var select = document.createElement("select");
    var auto = document.createElement("option");
    auto.value = "";
    auto.textContent = "Auto";
    select.appendChild(auto);
    (c.options || []).forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.value;
      opt.textContent = o.label;
      select.appendChild(opt);
    });
    select.disabled = !c.enabled;
    select.onfocus = function () { camHeld[c.key] = true; };
    select.onblur = function () { camHeld[c.key] = false; };
    select.onchange = function () { if (select.value !== "") sendCamera(target.id, c.key, select.value); };
    ctl.appendChild(select);
  } else if (c.type === "toggle") {
    var t = document.createElement("button");
    t.className = "toggle";
    t.disabled = !c.enabled;
    t.onclick = function () { sendCamera(target.id, c.key, !t.classList.contains("on")); };
    ctl.appendChild(t);
  } else if (c.type === "range") {
    if (c.key === "zoom") {
      var minus = document.createElement("button");
      minus.textContent = "−";
      minus.onclick = function () { api("/api/zoom", { layerId: target.id, factor: 1 / 1.25 }); };
      ctl.appendChild(minus);
    }
    var slider = document.createElement("input");
    slider.type = "range";
    slider.min = c.min;
    slider.max = c.max;
    slider.step = c.step || "any";
    slider.disabled = !c.enabled;
    var hold = function (on) { return function () { camHeld[c.key] = on; }; };
    slider.addEventListener("pointerdown", hold(true));
    slider.addEventListener("pointerup", hold(false));
    slider.addEventListener("pointercancel", hold(false));
    slider.addEventListener("blur", hold(false));
    slider.oninput = function () {
      var v = parseFloat(slider.value);
      value.textContent = fmtControl(c, v);
      sendCamera(target.id, c.key, v);
    };
    ctl.appendChild(slider);
    if (c.key === "zoom") {
      var plus = document.createElement("button");
      plus.textContent = "+";
      plus.onclick = function () { api("/api/zoom", { layerId: target.id, factor: 1.25 }); };
      ctl.appendChild(plus);
    }
    var value = document.createElement("span");
    value.className = "unit cam-value";
    ctl.appendChild(value);
  } else if (c.type === "action") {
    var a = document.createElement("button");
    a.textContent = c.label;
    a.onclick = function () {
      if (c.key !== "reset") { sendCamera(target.id, c.key, true); return; }
      confirmDialog("Back to automatic?", "Put " + target.label + " back on automatic. Its remembered zoom, focus, exposure and white balance are cleared.", c.label, true)
        .then(function (yes) { if (yes) sendCamera(target.id, c.key, null); });
    };
    label.textContent = "";
    ctl.appendChild(a);
  }
  if (!c.enabled && c.reason) {
    var why = document.createElement("div");
    why.className = "sub";
    why.textContent = c.reason;
    row.appendChild(why);
  } else if (c.key === "torch") {
    var torchNote = document.createElement("div");
    torchNote.className = "sub";
    torchNote.textContent = "Not remembered";
    row.appendChild(torchNote);
  }
  return row;
}

/** Values only, in place: the controls keep their place and a held one is left alone. */
function updateCamera(box, target) {
  target.controls.forEach(function (c) {
    if (camHeld[c.key]) return;
    var row = box.querySelector('.cam-field[data-key="' + c.key + '"]');
    if (!row) return;
    if (c.type === "choice") {
      var buttons = row.querySelectorAll(".seg button");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].className = buttons[i].dataset.value === c.value ? "on" : "";
      }
      var select = row.querySelector("select");
      if (select) select.value = c.value === null || c.value === undefined ? "" : c.value;
    } else if (c.type === "toggle") {
      var t = row.querySelector("button.toggle");
      t.className = "toggle" + (c.value ? " on" : "");
      t.textContent = c.value ? "On" : "Off";
    } else if (c.type === "range") {
      var slider = row.querySelector("input");
      var v = typeof c.value === "number" ? c.value : c.min;
      slider.value = v;
      row.querySelector(".cam-value").textContent = fmtControl(c, v);
    }
  });
}

/**
 * Coalesced per control: one request in flight, the newest value wins. One POST per slider
 * movement queued dozens, and a later one could land before an earlier.
 */
function sendCamera(targetId, key, value) {
  var id = targetId + "|" + key;
  camPending[id] = { target: targetId, key: key, value: value };
  if (camInFlight[id]) return;
  camInFlight[id] = true;
  var payload = camPending[id];
  delete camPending[id];
  api("/api/camera", payload).catch(function () {}).then(function () {
    camInFlight[id] = false;
    var next = camPending[id];
    if (next) sendCamera(next.target, next.key, next.value);
  });
}

// ---- gestures on the schematic ----

var MIN_SIZE = 0.08;   // same as the on-device editor, so both agree

function stageRect() { return document.getElementById("stage").getBoundingClientRect(); }

function layerById(id) {
  return (state && state.layers || []).filter(function (l) { return l.id === id; })[0];
}

function sendRect(l) {
  pendingRect = l;
  if (rectInFlight) return;
  rectInFlight = true;
  var payload = pendingRect;
  pendingRect = null;
  api("/api/layer/rect", {
    layerId: payload.id, left: payload.left, top: payload.top,
    right: payload.right, bottom: payload.bottom
  }).catch(function () {}).then(function () {
    rectInFlight = false;
    if (pendingRect) sendRect(pendingRect);   // coalesced: intermediate positions are dropped
  });
}

document.getElementById("stage").addEventListener("pointerdown", function (e) {
  var box = e.target.closest(".layer");
  if (!box) { selected = null; render(state); return; }

  var l = layerById(box.dataset.id);
  if (!l) return;

  if (l.id !== selected) { selected = l.id; render(state); return; }

  var onHandle = e.target.classList.contains("handle");
  var r = stageRect();
  dragging = {
    id: l.id, mode: onHandle ? "resize" : "move",
    startX: (e.clientX - r.left) / r.width,
    startY: (e.clientY - r.top) / r.height,
    origin: { left: l.left, top: l.top, right: l.right, bottom: l.bottom },
    layer: Object.assign({}, l)
  };
  // Capture on the stage, not on the box under the finger: every pointermove re-renders and
  // removes that box from the DOM, which drops the capture. The pointerup then landed wherever
  // the finger happened to be -- outside the stage if the drag went to an edge -- so endDrag
  // never ran, the layer stayed frozen at the drag position and ignored every later preset.
  document.getElementById("stage").setPointerCapture(e.pointerId);
});

document.getElementById("stage").addEventListener("pointermove", function (e) {
  if (!dragging) return;
  var r = stageRect();
  var x = (e.clientX - r.left) / r.width;
  var y = (e.clientY - r.top) / r.height;
  var o = dragging.origin;
  var next;

  if (dragging.mode === "move") {
    var w = o.right - o.left, h = o.bottom - o.top;
    var dx = Math.min(Math.max(x - dragging.startX, -o.left), 1 - o.right);
    var dy = Math.min(Math.max(y - dragging.startY, -o.top), 1 - o.bottom);
    next = { left: o.left + dx, top: o.top + dy, right: o.right + dx, bottom: o.bottom + dy };
  } else {
    // Resizes about the top-left corner, which stays put — same as the on-device editor.
    next = {
      left: o.left, top: o.top,
      right: Math.min(Math.max(x, o.left + MIN_SIZE), 1),
      bottom: Math.min(Math.max(y, o.top + MIN_SIZE), 1)
    };
  }

  dragging.layer = Object.assign({}, dragging.layer, next);
  dragging.layer.id = dragging.id;
  renderStage(state ? state.layers : []);
  sendRect(dragging.layer);
});

function endDrag() {
  if (!dragging) return;
  var id = dragging.id;
  dragging = null;
  api("/api/layer/commit", { layerId: id });
  // The schematic was held at the dragged position; let the phone's answer take over again.
  if (state) renderStage(state.layers);
}
document.getElementById("stage").addEventListener("pointerup", endDrag);
document.getElementById("stage").addEventListener("pointercancel", endDrag);
// Belt and braces: a pointer released outside the stage, or a window that lost focus mid-drag,
// must not leave a layer stuck.
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);
window.addEventListener("blur", endDrag);

// ---- other controls ----

document.getElementById("swap").onclick = function () { api("/api/layout/swap"); };
document.getElementById("mute").onclick = function () {
  // Absolute, from the state we are actually showing, and applied locally at once. Inverting a
  // cached value meant that while the state was stale every tap sent "mute" again, so once muted
  // there was no way back.
  var button = document.getElementById("mute");
  var next = !(state && state.muted);
  if (state) state.muted = next;
  button.textContent = next ? "Unmute" : "Mute";
  button.className = next ? "on" : "";
  api("/api/mute", { muted: next });
};
document.querySelectorAll("[data-preview]").forEach(function (b) {
  b.onclick = function () { api("/api/preview", { enabled: b.dataset.preview === "on" }); };
});
// Zero means "back to normal": the server already treated <= 0 as no cap, but the page had no
// button that sent it, so 360p and 10 fps were one-way doors.
document.querySelectorAll("[data-res]").forEach(function (b) {
  b.onclick = function () { api("/api/preview/resolution", { shortEdge: parseInt(b.dataset.res, 10) }); };
});
document.querySelectorAll("[data-fps]").forEach(function (b) {
  b.onclick = function () { api("/api/preview/fps", { maxFps: parseInt(b.dataset.fps, 10) }); };
});

// ---- tabs ----

var lastLiveKey = null;

function showTab(name) {
  var names = ["live", "cameras", "settings", "power"];
  if (names.indexOf(name) < 0) name = "live";
  names.forEach(function (n) {
    document.getElementById("tab-" + n).hidden = n !== name;
  });
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.className = b.dataset.tab === name ? "on" : "";
  });
  // Remembered per browser; storage may be unavailable (private mode), which only loses that.
  try { localStorage.setItem("lsTab", name); } catch (e) {}
  // Only once signed in: before that the request would be refused and sign the page out
  if ((name === "settings" || name === "power") && !settings && token) loadSettings();
  activeTab = name;
  schedulePicture(0);
}

// ---- the picture behind the stage ----

// Off by default: a picture every second is cheap for the phone (a small draw and a small JPEG,
// only while asked), but it is still work and Wi-Fi traffic nobody asked for.
var picFps = 0;
try { picFps = parseFloat(localStorage.getItem("lsPicFps")) || 0; } catch (e) {}
var picTimer = null;
var picBusy = false;
var picUrl = null;
var activeTab = "live";

/**
 * The stage takes the canvas's shape, as wide as the column but never taller than most of the
 * window: a portrait live would otherwise make it several screens tall on a wide screen.
 */
function setStageAspect(width, height) {
  if (!(width > 0 && height > 0)) return;
  var stage = document.getElementById("stage");
  stage.style.aspectRatio = width + "/" + height;
  stage.style.width = "min(100%, calc(70vh * " + (width / height).toFixed(4) + "))";
  stage.style.margin = "0 auto";
}

function picActive() {
  return picFps > 0 && !!token && activeTab === "live" && !document.hidden;
}

function setPicNote(text) {
  document.getElementById("picNote").textContent = text;
}

function renderPicRow() {
  Array.prototype.forEach.call(document.querySelectorAll("#picRow button"), function (b) {
    b.className = parseFloat(b.dataset.pic) === picFps ? "on" : "";
  });
}

function clearPicture() {
  if (picTimer) { clearTimeout(picTimer); picTimer = null; }
  var img = document.getElementById("stageImg");
  img.hidden = true;
  img.removeAttribute("src");
  if (picUrl) { URL.revokeObjectURL(picUrl); picUrl = null; }
  setPicNote("");
}

/** The next picture after [delay] ms, or none when nobody is looking. */
function schedulePicture(delay) {
  if (picTimer) { clearTimeout(picTimer); picTimer = null; }
  if (!picActive()) {
    if (picFps === 0) clearPicture();
    return;
  }
  picTimer = setTimeout(loadPicture, Math.max(0, delay || 0));
}

/**
 * One picture at a time: the next is asked for only after this one arrived, so a slow Wi-Fi
 * lowers the rate instead of piling requests up on the phone.
 */
function loadPicture() {
  picTimer = null;
  if (!picActive() || picBusy) return;
  picBusy = true;
  var started = Date.now();
  fetch("/api/preview.jpg?t=" + started, { headers: { "Authorization": "Bearer " + token } })
    .then(function (r) {
      if (r.status === 401) { signOut(); throw new Error("unauthorized"); }
      if (r.status === 204) {
        setPicNote(r.headers.get("X-Preview-Reason") || "No picture");
        return null;
      }
      return r.blob();
    })
    .then(function (blob) {
      picBusy = false;
      if (!blob) { schedulePicture(3000); return; }
      var url = URL.createObjectURL(blob);
      var img = document.getElementById("stageImg");
      img.onload = function () {
        if (picUrl && picUrl !== url) URL.revokeObjectURL(picUrl);
        picUrl = url;
        img.hidden = false;
        // Without a composition the page does not know the canvas: the picture says it
        if (!state || !state.canvasWidth) setStageAspect(img.naturalWidth, img.naturalHeight);
      };
      img.src = url;
      setPicNote("What goes out, before compression · " + (picFps < 1 ? "every " + (1 / picFps) + " s" : picFps + " per second"));
      schedulePicture(1000 / picFps - (Date.now() - started));
    })
    .catch(function () { picBusy = false; schedulePicture(3000); });
}

Array.prototype.forEach.call(document.querySelectorAll("#picRow button"), function (b) {
  b.onclick = function () {
    picFps = parseFloat(b.dataset.pic);
    try { localStorage.setItem("lsPicFps", String(picFps)); } catch (e) {}
    renderPicRow();
    schedulePicture(0);
  };
});
renderPicRow();
document.addEventListener("visibilitychange", function () { schedulePicture(0); });

Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
  b.onclick = function () { showTab(b.dataset.tab); };
});

// ---- settings ----

var settings = null;       // the last GET /api/settings
var settingsGroup = "video";
var dirty = {};            // key -> edited value, not saved yet
var fieldErrors = {};      // key -> why the phone refused it
var settingsStale = false; // changed elsewhere while this page had unsaved edits

// When a group's changes take effect, said once for the group; a field that differs says so itself.
var GROUP_APPLIES = { video: "when_idle", audio: "when_idle", destination: "next_live",
                      recording: "next_recording", power: "now" };
var GROUP_APPLIES_TEXT = {
  when_idle: "Changes apply at once when nothing is streaming, otherwise when the live stops.",
  next_live: "Changes apply at the next live, and are locked while one is on.",
  next_recording: "Changes apply to the next recording.",
  now: "Changes apply at once."
};
var FIELD_APPLIES_TEXT = {
  now: "applies at once",
  when_idle: "applies when nothing is streaming",
  next_live: "applies at the next live",
  next_recording: "applies to the next recording"
};

function hasDirty() { return Object.keys(dirty).length > 0; }

function loadSettings() {
  return api("/api/settings", undefined, "GET").then(function (s) {
    if (!s || !s.groups) return;
    settings = s;
    settingsStale = false;
    renderSettings();
  }).catch(function () {});
}

/** Something changed on the phone or on another page. */
function settingsChanged() {
  if (!settings) return;
  // Never pull the form from under an edit in progress
  var editing = document.activeElement && document.activeElement.closest &&
    document.activeElement.closest("#setForm, #powerForm");
  if (hasDirty() || editing) { settingsStale = true; return; }
  loadSettings();
}

function groupById(id) {
  return settings && settings.groups.filter(function (g) { return g.id === id; })[0];
}

function renderSettings() {
  if (!settings) return;
  var bar = document.getElementById("setGroups");
  bar.innerHTML = "";
  settings.groups.forEach(function (g) {
    if (g.id === "power") return;  // it has its own tab
    var b = document.createElement("button");
    b.textContent = g.title;
    b.className = g.id === settingsGroup ? "on" : "";
    b.onclick = function () { settingsGroup = g.id; renderSettings(); };
    bar.appendChild(b);
  });
  var group = groupById(settingsGroup) || settings.groups[0];
  var notes = [];
  if (settings.live && group.id === "destination") notes.push("A live is on: the destination is locked until it stops.");
  else if (settings.live && (group.id === "video" || group.id === "audio")) notes.push("A live is on: changes here are saved and apply when it stops.");
  else if (GROUP_APPLIES_TEXT[GROUP_APPLIES[group.id]]) notes.push(GROUP_APPLIES_TEXT[GROUP_APPLIES[group.id]]);
  if (group.note) notes.push(group.note);
  if (group.id === "recording" && settings.recordingFolder) notes.push("Folder: " + settings.recordingFolder);
  document.getElementById("setNote").textContent = notes.join(" ");
  renderFields(document.getElementById("setForm"), group);
  renderFields(document.getElementById("powerForm"), groupById("power"));
  document.getElementById("setDiscard").disabled = !hasDirty();
}

function currentValue(field) {
  return Object.prototype.hasOwnProperty.call(dirty, field.key) ? dirty[field.key] : field.value;
}

function setDirty(field, value) {
  var original = field.value;
  if (!field.secret && String(value) === String(original)) delete dirty[field.key];
  else if (field.secret && value === "") delete dirty[field.key];
  else dirty[field.key] = value;
  delete fieldErrors[field.key];
  document.getElementById("setDiscard").disabled = !hasDirty();
}

function renderFields(box, group) {
  box.innerHTML = "";
  if (!group) return;
  if (!group.fields.length) {
    var none = document.createElement("div");
    none.className = "muted";
    none.textContent = "Nothing to set here with this destination.";
    box.appendChild(none);
    return;
  }
  group.fields.forEach(function (field) { box.appendChild(buildField(field)); });
}

function buildField(field) {
  var row = document.createElement("div");
  row.className = "field" + (Object.prototype.hasOwnProperty.call(dirty, field.key) ? " dirty" : "");
  var label = document.createElement("label");
  label.textContent = field.label;
  if (field.pending) {
    var badge = document.createElement("span");
    badge.className = "badge wait";
    badge.textContent = "waiting";
    badge.title = "Saved; applies when the live stops";
    label.appendChild(badge);
  }
  row.appendChild(label);

  var locked = field.applies === "next_live" && settings.live;
  var ctl = document.createElement("div");
  ctl.className = "ctl";
  var value = currentValue(field);
  var input;

  function markRow() { row.className = "field" + (Object.prototype.hasOwnProperty.call(dirty, field.key) ? " dirty" : ""); }

  if (field.type === "bool") {
    input = document.createElement("button");
    input.className = "toggle" + (value ? " on" : "");
    input.textContent = value ? "On" : "Off";
    input.onclick = function () {
      var next = !(currentValue(field) === true);
      setDirty(field, next);
      input.className = "toggle" + (next ? " on" : "");
      input.textContent = next ? "On" : "Off";
      markRow();
    };
  } else if (field.options) {
    input = document.createElement("select");
    var known = false;
    field.options.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.value;
      opt.textContent = o.label;
      if (String(o.value) === String(value)) { opt.selected = true; known = true; }
      input.appendChild(opt);
    });
    if (!known && value !== null && value !== undefined) {
      var cur = document.createElement("option");
      cur.value = String(value);
      cur.textContent = String(value) + " (not available)";
      cur.selected = true;
      input.insertBefore(cur, input.firstChild);
    }
    input.onchange = function () { setDirty(field, input.value); markRow(); };
  } else if (field.secret) {
    input = document.createElement("input");
    input.type = "password";
    input.autocomplete = "new-password";
    input.placeholder = field.isSet ? "saved (" + field.hint + ")" : "not set";
    input.value = Object.prototype.hasOwnProperty.call(dirty, field.key) && dirty[field.key] ? dirty[field.key] : "";
    input.oninput = function () { setDirty(field, input.value); markRow(); };
  } else {
    input = document.createElement("input");
    var numeric = field.type === "int" || field.format === "port" || field.format === "latency_ms" || field.format === "mtu";
    input.type = numeric ? "number" : "text";
    if (numeric) input.inputMode = "numeric";
    if (field.min !== undefined && field.min !== null) input.min = field.min;
    if (field.max !== undefined && field.max !== null) input.max = field.max;
    if (field.type === "int") input.step = (value !== null && value < 1000) ? 50 : 500;
    input.value = value === null || value === undefined ? "" : value;
    input.oninput = function () {
      var v = input.value;
      setDirty(field, field.type === "int" ? (v === "" ? "" : Number(v)) : v);
      markRow();
    };
  }
  input.disabled = locked;
  if (locked) input.title = "Stop the live to change this";
  ctl.appendChild(input);
  if (field.secret && field.isSet) {
    var clear = document.createElement("button");
    clear.textContent = "Clear";
    clear.disabled = locked;
    clear.onclick = function () {
      dirty[field.key] = null;
      input.value = "";
      input.placeholder = "will be cleared";
      markRow();
      document.getElementById("setDiscard").disabled = false;
    };
    ctl.appendChild(clear);
  }
  if (field.unit) {
    var unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = field.unit;
    ctl.appendChild(unit);
  }
  row.appendChild(ctl);

  var groupApplies = GROUP_APPLIES[field.key && groupOf(field.key)];
  var appliesText = field.applies !== groupApplies ? FIELD_APPLIES_TEXT[field.applies] : "";
  var keepText = field.secret && field.isSet ? "leave empty to keep it" : "";
  var subText = [field.help, keepText, appliesText].filter(function (t) { return t; }).join(" · ");
  if (field.min !== undefined && field.min !== null && field.type === "int") {
    subText = (subText ? subText + " · " : "") + field.min + "–" + field.max + " " + (field.unit || "");
  }
  if (subText) {
    var sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = subText;
    row.appendChild(sub);
  }
  if (fieldErrors[field.key]) {
    var err = document.createElement("div");
    err.className = "err";
    err.textContent = fieldErrors[field.key];
    row.appendChild(err);
  }
  return row;
}

function saveSettings(keys) {
  var changes = {};
  keys.forEach(function (k) { if (Object.prototype.hasOwnProperty.call(dirty, k)) changes[k] = dirty[k]; });
  if (!Object.keys(changes).length) { showStatus("Nothing to save", "#444"); return; }
  api("/api/settings", { changes: changes }).then(function (res) {
    if (!res) return;
    (res.applied || []).concat(res.pending || []).forEach(function (k) { delete dirty[k]; });
    fieldErrors = res.rejected || {};
    var parts = [];
    if (res.applied && res.applied.length) parts.push(res.applied.length + " applied");
    if (res.pending && res.pending.length) parts.push(res.pending.length + " saved, waiting");
    var refused = Object.keys(fieldErrors).length;
    if (refused) parts.push(refused + " refused");
    showStatus(parts.join(" · ") || "Saved", refused ? "#7a3a3a" : "#2e5e2e");
    document.getElementById("setWarnings").textContent = (res.warnings || []).join(" · ");
    loadSettings();
  }).catch(function () {});
}

function groupOf(key) {
  var found = settings && settings.groups.filter(function (g) {
    return g.fields.some(function (f) { return f.key === key; });
  })[0];
  return found ? found.id : null;
}

function keysOfGroup(id) {
  var g = groupById(id);
  return g ? g.fields.map(function (f) { return f.key; }) : [];
}

document.getElementById("setSave").onclick = function () { saveSettings(Object.keys(dirty).filter(function (k) {
  return keysOfGroup("power").indexOf(k) < 0;
})); };
document.getElementById("powerSave").onclick = function () { saveSettings(keysOfGroup("power")); };
document.getElementById("setDiscard").onclick = function () {
  dirty = {};
  fieldErrors = {};
  document.getElementById("setWarnings").textContent = "";
  if (settingsStale) loadSettings(); else renderSettings();
};

// ---- start ----

// The PIN arrives in the fragment, which browsers never send to the server, so it stays out of
// access logs. Clear it from the bar once used.
function currentTab() {
  try { return localStorage.getItem("lsTab") || "live"; } catch (e) { return "live"; }
}
showTab(currentTab());

var hashPin = (location.hash || "").replace("#", "").trim();
if (hashPin) {
  history.replaceState(null, "", location.pathname);
  enter(hashPin);
} else if (token) {
  document.getElementById("gate").hidden = true;
  document.getElementById("main").hidden = false;
  connect();
  api("/api/state", undefined, "GET").then(render).catch(function () { signOut(); });
}
</script>
</body>
</html>
